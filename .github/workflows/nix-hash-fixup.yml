name: nix-hash-fixup
on:
  pull_request:
    branches: [main]

jobs:
  fixup:
    if: startsWith(github.head_ref, 'renovate/')
    uses: stack4ops/renovate/.github/workflows/nix-hash-fixup.yml@7b6a393af8e6c82195869479e21f0d2d9c15ccb1 # main
    with:
      attributes: zot-bin
    secrets:
      token: ${{ secrets.RENOVATE_TOKEN }}
