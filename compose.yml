services:
  zot:
    # before "docker compose up":
    #   nix build .#zot
    #   docker load < result
    #
    # The tag is the one baked into the archive by buildImage (name/tag in
    # images/zot.nix), NOT the zot version and NOT the registry path argunix
    # derives from the flake attribute name.
    image: zot:latest
    container_name: zot
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - zot-data:/var/lib/registry
      - ./config.json:/etc/zot/config.json:ro

volumes:
  zot-data:
